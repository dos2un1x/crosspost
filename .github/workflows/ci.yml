name: CI

# 触发策略（2026-09-22 / v2.105 调整）：
#   · pull_request → main：改主线前先看见
#   · schedule：**每天 02:10（北京时间）自动跑一次**（cron 用 UTC：18:10 UTC = 次日 02:10 +08）
#   · workflow_dispatch：手动下发
# push 仍不自动跑（避免每个 commit 都吃 Actions 分钟）——每日一次足够守住"开箱即用"这条线。
#
# 私有 submodule（2026-10-24）：
#   `crosspost-runtime/core/src/adapters` 指向私有仓库 `dos2un1x/adapters`。public 父仓库的
#   默认 GITHUB_TOKEN 只能读当前仓库，克隆不了它，所以除 static 外的作业都需要仓库 secret
#   `SUBMODULE_TOKEN`（fine-grained PAT，对 dos2un1x/adapters 只读）。
#   fork PR 拿不到 secret，因此这些作业对 fork PR 直接跳过；static（lint/format）仍照常跑。
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '10 18 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 测试设计假设「测试机时区=北京」（isPeak/calcSessionCost 等用本地时区判定峰谷）；
# GitHub Actions runner 默认 UTC，需强制北京时区否则纯函数断言失败。放在这里而不是每个作业里，
# 少一处漏配（2026-10-10 拆作业时改的）。
env:
  TZ: Asia/Shanghai

# ── 为什么拆成多个作业（2026-10-10）──────────────────────────────────────────
# 拆之前是**单个 test 作业串行 12 步**：实测 223s，其中「Runtime test + coverage」一步独占
# **151s**（68%）——静态检查、core、冒烟全排在它后面干等。现在按"互不依赖"拆开并行：
#
#   static（lint/format） · core（typecheck/vitest） · runtime×2（分片） ·
#   coverage（覆盖率门槛） · smoke（空环境 + systemd） · fresh-clone
#
# 两条纪律：
#   · **门禁一项不减**：lint / format / typecheck / core 覆盖率门槛 / runtime 覆盖率门槛 /
#     空环境冒烟 / systemd 单元 / 干净 clone，全都还在（只是换了作业）；
#   · **分片不写死名单**：files 按序号轮转切两半（见 runtime 作业里的守卫步骤，它会断言
#     "两片并集 == 全部测试文件"）——新增测试文件自动进片，改切法漏跑会当场报红。
#
# 覆盖率为什么不跟着分片：`node --test --experimental-test-coverage` 的阈值是**按整轮**判的，
# 只跑一半必然低于门槛（那是假红）。所以覆盖率单独一个作业跑**全量**，与分片并行。
#
# 想省分钟（墙钟不变）：给 coverage 作业加 `if: github.event_name == 'schedule'`，即只在每日跑。

jobs:
  # ① 静态：lint + 格式（不需要 core/dist，也不需要 tag）
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 根依赖（eslint/prettier/typescript-eslint）。`cache: npm` 缓存 ~/.npm：
      # 拆作业后每个作业都要装一遍依赖，不缓存等于把省下的时间还回去。
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crosspost-runtime/package-lock.json
            bridge/package-lock.json

      - name: Root install
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier --check)
        run: npm run format:check

  # ② core：构建 + 类型门槛 + vitest（含覆盖率门槛，15s 上下，不拆）
  core:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0` + `fetch-tags: true`：版本真值是 tag（`versionInfo().engine` = `git describe`），
      # 而 checkout 默认只拉一个裸提交、**不带 tag** —— 那会让版本退化成读到一个短 SHA，
      # `version-contract` 直接判红（首跑就是这么红的）。
      - uses: actions/checkout@v5
        with:
          # 私有 submodule：默认 GITHUB_TOKEN 读不到 dos2un1x/adapters，必须用 PAT。
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crosspost-runtime/package-lock.json
            bridge/package-lock.json

      # 运行时依赖：runtime-node.mjs 等用 jsdom/ws/@mozilla/readability。
      # **core 的整棵依赖图也在这里**（v2.3.1：npm 把 `file:./core` 当工作区 hoist，
      # core 不再有自己的 node_modules 与 lock —— 见 docs/dependencies.md §1.1）。
      - name: Runtime install
        working-directory: crosspost-runtime
        run: npm ci

      - name: Core build
        working-directory: crosspost-runtime/core
        run: npm run build

      - name: Core typecheck (tsc --noEmit --strict)
        working-directory: crosspost-runtime/core
        run: npm run typecheck

      - name: Core test (vitest + coverage)
        working-directory: crosspost-runtime/core
        run: npm run test:coverage

  # ③ runtime：分两片并行（本作业占原 151s 里的绝大部分，分片是墙钟最大的杠杆）
  runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v5
        with:
          # 私有 submodule：默认 GITHUB_TOKEN 读不到 dos2un1x/adapters，必须用 PAT。
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crosspost-runtime/package-lock.json
            bridge/package-lock.json

      # zstd：token-cost.mjs 测试用 zstd 压缩会话文件（Linux 需安装）。
      # runner 镜像**自带** zstd 时这条是空操作 —— 先探测再装，省掉 apt-get update 那十几秒。
      - name: Install zstd（缺失才装）
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)

      - name: Runtime install
        working-directory: crosspost-runtime
        run: npm ci

      # bridge 依赖：bridge/run-bridge.mjs 用 ws（bridge 目录独立解析，需装到 bridge/node_modules）
      - name: Bridge install
        working-directory: bridge
        run: npm ci

      - name: Core build
        working-directory: crosspost-runtime/core
        run: npm run build

      # 分片清单 + **并集守卫**：两片必须恰好覆盖全部 `tests/*.test.mjs`。
      # 切法是"按序号轮转"（不是按文件大小：实测按大小贪心两片反而差更多 —— 文件大小与
      # 耗时不成正比，"小而慢"的集成测试文件不少）。守卫在这里而不在别处：它跟"本次真正
      # 要跑什么"是同一份计算，改了切法就是同一处改。
      # 注：分片均衡不是墙钟的杠杆 —— 覆盖率作业（跑全量）才是关键路径，见文件顶部。
      - name: 分片清单 + 并集守卫
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node -e '
            const fs = require("node:fs")
            const shard = Number(process.env.SHARD)
            const all = fs.readdirSync("crosspost-runtime/tests")
              .filter((f) => f.endsWith(".test.mjs")).sort()
            const a = all.filter((_, i) => i % 2 === 0)
            const b = all.filter((_, i) => i % 2 === 1)
            const union = new Set([...a, ...b])
            if (union.size !== all.length || all.some((f) => !union.has(f))) {
              console.error("分片并集 != 全部测试文件 —— 有测试文件两片都不跑")
              process.exit(1)
            }
            const mine = shard === 0 ? a : b
            console.log(`分片 ${shard}：${mine.length}/${all.length} 个文件（两片并集已核对）`)
            fs.writeFileSync("/tmp/shard.txt", mine.map((f) => `tests/${f}`).join("\n") + "\n")
          '

      - name: Runtime test（本片）
        working-directory: crosspost-runtime
        run: node --test $(tr '\n' ' ' < /tmp/shard.txt)

  # ④ 覆盖率门槛：跑**全量**（阈值按整轮判，不能分片），与分片并行互不占墙钟
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # 私有 submodule：默认 GITHUB_TOKEN 读不到 dos2un1x/adapters，必须用 PAT。
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crosspost-runtime/package-lock.json
            bridge/package-lock.json

      - name: Install zstd（缺失才装）
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)

      - name: Runtime install
        working-directory: crosspost-runtime
        run: npm ci

      - name: Bridge install
        working-directory: bridge
        run: npm ci

      - name: Core build
        working-directory: crosspost-runtime/core
        run: npm run build

      # 运行时测试 + 覆盖率门槛（行 76 / 分支 68 / 函数 68）
      - name: Runtime test (node --test + coverage)
        working-directory: crosspost-runtime
        run: npm run test:coverage

  # ⑤ Linux 独有证据 + 空环境冒烟（原先排在 test 作业最后，前面一红就轮不到它们）
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # 私有 submodule：默认 GITHUB_TOKEN 读不到 dos2un1x/adapters，必须用 PAT。
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crosspost-runtime/package-lock.json
            bridge/package-lock.json

      - name: Runtime install
        working-directory: crosspost-runtime
        run: npm ci

      - name: Bridge install
        working-directory: bridge
        run: npm ci

      - name: Core build
        working-directory: crosspost-runtime/core
        run: npm run build

      # systemd 用户单元的形状（Linux 独有证据，v2.1）：把 `print` 出来的单元交给**真解析器**。
      # 契约测试只在任何平台做等效 INI 校验（macOS 开发机没有 systemd-analyze），
      # 这一条才是"Linux 上这份单元能不能被读进去"的实证。`print` 不碰系统，所以 runner 上安全。
      - name: systemd unit shape (systemd-analyze verify)
        run: |
          bridge/install-systemd.sh print 9539 > /tmp/crosspost-bridge.service
          head -20 /tmp/crosspost-bridge.service
          systemd-analyze verify /tmp/crosspost-bridge.service

      # 空环境冒烟：零项目接入也能装/跑/自检/渲染（P0「引擎自治」的核心验收）。
      # 它此前**只在本机验收里跑**，CI 完全没有覆盖 —— 一条只在"有人记得手动跑"时才生效的
      # 检查等于没有（v2.60 的教训）。
      - name: Empty-env smoke (setup → doctor → bridge → render)
        run: npm run test:smoke

  # ⑥ 开箱即用：干净 clone 能不能装起来
  #
  # 为什么单独一个 job：这一条**只在"没有任何 node_modules 的机器"上才会红**，
  # 而上面几个 job 都把依赖装好了 —— 结构上不可能发现这类断点
  # （v2.104 修的正是它：根 package.json 没有 workspaces，`npm install` 只装根 devDeps，
  #  core 的 tsup 与 bridge 的 ws 都不入库）。
  # 冒烟自己造沙箱、自己按 README 走两步、再真起一次桥，因此**不需要**前置安装步骤。
  #
  # 注意：`verify:acceptance` **不能**放到 CI —— 它有一半检查依赖本机生产状态
  # （生产草稿、本机接入项目、launchd 槽位、9540 上的桥、系统 Chrome），
  # 在 runner 上会把"环境缺"报成"代码红"。验收仍是本机命令。
  fresh-clone:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 同上：`fresh-clone-smoke` 要拿仓库 tag 核对回退版本的主次版本
      - uses: actions/checkout@v5
        with:
          # 私有 submodule：默认 GITHUB_TOKEN 读不到 dos2un1x/adapters，必须用 PAT。
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # 冒烟会在 /tmp 造沙箱并重新装两处依赖（runtime / bridge）；缓存 ~/.npm 让它快一些
      - name: Cache npm (all packages)
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-all-${{ hashFiles('package-lock.json', 'crosspost-runtime/package-lock.json', 'bridge/package-lock.json') }}
          restore-keys: |
            npm-all-

      - name: Fresh-clone smoke (README 2 steps → doctor → bridge)
        run: node crosspost-runtime/tests/fresh-clone-smoke.mjs

